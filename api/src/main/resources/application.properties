# JWT Keys Configuration
jwt.public.key=classpath:keys/app.pub
jwt.private.key=classpath:keys/app.key

# LLM local (compatível com API /api/chat do Ollama)
llm.api.base-url=${LLM_API_BASE_URL:http://127.0.0.1:11435}
llm.api.model=${LLM_API_MODEL:qwen2.5:7b-instruct}
llm.api.connect-timeout=5s
llm.api.read-timeout=2m
# Opções de inferência repassadas ao Ollama
llm.api.options.num-ctx=4096
llm.api.options.num-predict=600
llm.api.options.temperature=0.4
llm.api.options.top-p=0.9
llm.api.options.repeat-penalty=1.1
# Mantém o modelo carregado em VRAM por 30 minutos para evitar cold start
llm.api.keep-alive=30m
# Truncamento do histórico passado ao LLM (apenas mensagens user/assistant)
llm.api.history.max-messages=20

# Rate Limit Configuration (Bucket4j)
# Capacidade padrão do bucket (número máximo de tokens)
ratelimit.default.capacity=100
# Número de tokens a serem repostos
ratelimit.default.refill.tokens=100
# Duração em segundos para repor os tokens
ratelimit.default.refill.duration=60

# Rate Limit para Login (proteção contra brute force)
# Número máximo de tentativas de login permitidas
ratelimit.login.capacity=5
# Número de tokens a serem repostos (geralmente igual à capacidade)
ratelimit.login.refill.tokens=5
# Duração em segundos para repor os tokens (15 minutos = 900 segundos)
ratelimit.login.refill.duration=900

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.persistAuthorization=true
spring.docker.compose.enabled=false

# Upload de planilhas
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
