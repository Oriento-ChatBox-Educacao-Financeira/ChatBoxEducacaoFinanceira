name: Python Assistant CI

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "assistant-service/**"
      - ".github/workflows/python-assistant-ci.yml"

  pull_request:
    paths:
      - "assistant-service/**"
      - ".github/workflows/python-assistant-ci.yml"

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assistant-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: assistant-service/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build assistant service image
        run: docker build -t oriento-assistant:ci assistant-service