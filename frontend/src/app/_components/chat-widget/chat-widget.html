<div class="chat-widget">
  <!-- FLOAT BUTTON -->
  <button *ngIf="!isOpen" class="chat-floating-button" (click)="toggleChat()">
    <i class="ph ph-finn-the-human"></i>
  </button>

  <!-- CHAT -->
  <div *ngIf="isOpen" class="chat-container">
    <!-- HEADER -->
    <div class="chat-header">
      <div class="chat-header__left">
        <div class="chat-avatar">
          <i class="ph ph-finn-the-human"></i>
        </div>

        <div>
          <span class="chat-header__eyebrow">ASSISTENTE FINANCEIRO</span>

          <h3>Oriento AI</h3>
        </div>
      </div>

      <div class="chat-header__actions">
        <!-- EXPAND -->
        <button class="header-action" (click)="openFullChat()">
          <i class="ph ph-arrows-out-simple"></i>
        </button>

        <!-- CLOSE -->
        <button class="header-action danger" (click)="toggleChat()">
          <i class="ph ph-x"></i>
        </button>
      </div>
    </div>

    <!-- MESSAGES -->
    <div class="chat-body">
      <!-- EMPTY STATE -->
      <div *ngIf="messages.length === 0" class="chat-empty">
        <div class="chat-empty__icon">
          <i class="ph ph-question"></i>
        </div>

        <h2>Como posso ajudar?</h2>

        <p>
          Faça perguntas sobre fluxo de caixa, DRE, indicadores financeiros, margem operacional e
          projeções.
        </p>
      </div>

      <!-- USER -->
      <div
        *ngFor="let msg of messages; trackBy: trackByIndex"
        class="message"
        [ngClass]="msg.sender === 'user' ? 'user-message' : 'bot-message'"
      >
        <!-- USER -->
        <ng-container *ngIf="msg.sender === 'user'">
          <div class="message-user-bubble">
            {{ msg.text }}
          </div>
        </ng-container>

        <!-- BOT -->
        <ng-container *ngIf="msg.sender === 'bot'">
          <div class="bot-row">
            <div class="bot-avatar">
              <i class="ph ph-finn-the-human"></i>
            </div>

            <div class="bot-bubble">
              {{ msg.text }}
            </div>
          </div>
        </ng-container>
      </div>
    </div>

    <!-- QUICK ACTIONS -->
    <div class="chat-suggestions">
      <button class="suggestion-button" (click)="sendSuggestion('Explicar minha DRE')">
        Explicar minha DRE
      </button>

      <button class="suggestion-button" (click)="sendSuggestion('Projetar fluxo de caixa')">
        Fluxo de caixa
      </button>

      <button class="suggestion-button" (click)="sendSuggestion('Analisar margem operacional')">
        Margem operacional
      </button>
    </div>

    <!-- INPUT -->
    <div class="chat-input-area">
      <div class="chat-input-wrapper">
        <textarea
          [(ngModel)]="userInput"
          placeholder="Digite sua pergunta..."
          rows="1"
          (keydown.enter)="sendMessage()"
        ></textarea>

        <button class="send-button" [disabled]="isSending" (click)="sendMessage()">
          <i class="ph ph-paper-plane-right"></i>
        </button>
      </div>

      <div class="chat-footer">
        <span> O Oriento pode cometer erros. Revise informações importantes. </span>

        <button class="human-button">
          <i class="ph ph-user"></i>
          Humano
        </button>
      </div>
    </div>
  </div>
</div>
