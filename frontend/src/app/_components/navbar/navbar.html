<nav class="sidebar" [class.sidebar--collapsed]="collapsed()">
  <!-- Toggle: hambúrguer animado que vira X -->
  <button
    class="sidebar-toggle"
    type="button"
    (click)="toggleSidebar()"
    [class.sidebar-toggle--open]="!collapsed()"
    [attr.aria-label]="collapsed() ? 'Expandir menu' : 'Recolher menu'"
    [title]="collapsed() ? 'Expandir menu' : 'Recolher menu'"
  >
    <span class="sidebar-toggle__bars" aria-hidden="true">
      <span class="sidebar-toggle__bar"></span>
      <span class="sidebar-toggle__bar"></span>
      <span class="sidebar-toggle__bar"></span>
    </span>
  </button>

  <!-- Logo -->
  <div class="sidebar-logo">
    <span class="sidebar-logo__brand">{{ collapsed() ? 'O' : 'ORIENTO' }}</span>
    <span class="sidebar-logo__sub" *ngIf="!collapsed()">Sabedoria Financeira</span>
  </div>

  <!-- Novo Lançamento -->
  <div class="sidebar-new">
    <button
      class="sidebar-new__btn"
      (click)="novoLancamento()"
      [title]="collapsed() ? 'Novo Lançamento' : ''"
    >
      <img src="/sidebar/icon-mais.svg" alt="" class="sidebar-new__icon" />
      <span *ngIf="!collapsed()">Novo Lançamento</span>
    </button>
  </div>

  <!-- Menu principal -->
  <ul class="sidebar-menu">
    <!-- Dashboard (expansível) -->
    <li class="menu-item" [class.menu-item--open]="isDashboardOpen && !collapsed()">
      <div class="menu-item__row" (click)="toggleDashboard()" [title]="collapsed() ? 'Dashboard' : ''">
        <div class="menu-item__left">
          <img src="/sidebar/icon-dashboard.svg" alt="" class="menu-item__icon" />
          <span
            *ngIf="!collapsed()"
            class="menu-item__label"
            [class.menu-item__label--active]="isDashboardOpen"
            >Dashboard</span
          >
        </div>
        <img
          *ngIf="!collapsed()"
          src="/sidebar/icon-setaMenu.svg"
          alt=""
          class="menu-item__chevron"
          [class.menu-item__chevron--open]="isDashboardOpen"
        />
      </div>

      <!-- Submenu -->
      @if (isDashboardOpen && !collapsed()) {
        <ul class="submenu">
          <li
            class="submenu__item"
            [class.submenu__item--active]="activeRoute === 'visao-geral'"
            (click)="navigate('visao-geral')"
          >
            Visão geral
          </li>
          <li
            class="submenu__item"
            [class.submenu__item--active]="activeRoute === 'dre'"
            (click)="navigate('dre')"
          >
            DRE
          </li>
          <li
            class="submenu__item"
            [class.submenu__item--active]="activeRoute === 'fluxo-caixa'"
            (click)="navigate('fluxo-caixa')"
          >
            Fluxo de Caixa
          </li>
          <li
            class="submenu__item"
            [class.submenu__item--active]="activeRoute === 'balanco-patrimonial'"
            (click)="navigate('balanco-patrimonial')"
          >
            Balanço Patrimonial
          </li>
        </ul>
      }
    </li>

    <li
      class="menu-item"
      [class.menu-item--active]="activeRoute === 'chat'"
      (click)="navigate('chat')"
    >
      <div class="menu-item__row" [title]="collapsed() ? 'Chat' : ''">
        <div class="menu-item__left">
          <img src="/sidebar/icon-chat.svg" alt="" class="menu-item__icon" />
          <span *ngIf="!collapsed()" class="menu-item__label">Chat</span>
        </div>
      </div>
    </li>

    <li
      class="menu-item"
      [class.menu-item--active]="activeRoute === 'relatorios'"
      (click)="navigate('relatorios')"
    >
      <div class="menu-item__row" [title]="collapsed() ? 'Relatórios' : ''">
        <div class="menu-item__left">
          <img src="/sidebar/icon-relatorio.svg" alt="" class="menu-item__icon" />
          <span *ngIf="!collapsed()" class="menu-item__label">Relatórios</span>
        </div>
      </div>
    </li>

  </ul>

  <!-- Rodapé -->
  <ul class="sidebar-footer">
    <li class="menu-item" (click)="navigate('suporte')">
      <div class="menu-item__row" [title]="collapsed() ? 'Suporte' : ''">
        <div class="menu-item__left">
          <img src="/sidebar/icon-suporte.svg" alt="" class="menu-item__icon" />
          <span *ngIf="!collapsed()" class="menu-item__label">Suporte</span>
        </div>
      </div>
    </li>
    <li class="menu-item" (click)="sair()">
      <div class="menu-item__row" [title]="collapsed() ? 'Sair' : ''">
        <div class="menu-item__left">
          <img src="/sidebar/icon-exit.svg" alt="" class="menu-item__icon" />
          <span *ngIf="!collapsed()" class="menu-item__label">Sair</span>
        </div>
      </div>
    </li>
  </ul>
</nav>
