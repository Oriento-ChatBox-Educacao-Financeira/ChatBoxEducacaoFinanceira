<header class="topbar">

  <!-- Busca -->
  <div class="topbar__search-wrap">
    <img src="/topbar/icon-pesquisa.svg" alt="" class="topbar__search-icon" />
    <input
      type="text"
      class="topbar__search"
      placeholder="Pesquise seus dados financeiros..."
      [(ngModel)]="searchQuery"
    />
  </div>

  <!-- Direita -->
  <div class="topbar__right">
    <!-- Notificação -->
    <button class="topbar__icon-btn" (click)="abrirNotificacoes()">
      <img src="/topbar/icon-notificacao.svg" alt="Notificações" class="topbar__icon" />
    </button>

    <!-- Perfil -->
    <div class="topbar__profile">
      <img
        src="/profile/lucelho-testimonial.jpeg"
        alt="Foto de perfil"
        class="topbar__avatar"
      />
      <span class="topbar__username">{{ userName }}</span>
    </div>
  </div>

</header>
